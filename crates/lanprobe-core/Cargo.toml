[package]
name = "lanprobe-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "LanProbe core — platform network logic shared by the desktop app and the headless server"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
reqwest = { workspace = true }
dirs-next = { workspace = true }
rand = { workspace = true }
ping-async = { workspace = true }
dns-lookup = { workspace = true }

# Hachage des secrets (module `passwords`, partagé avec le hub web)
argon2 = "0.5"
getrandom = "0.2"
base64 = "0.22"

# AEAD du scellement au repos (module `secrets`, partagé lui aussi).
ring = "0.17"
hickory-resolver = "0.26"

[dev-dependencies]
tokio-test = "0.4"
