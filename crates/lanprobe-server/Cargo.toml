[package]
name = "lanprobe-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "LanProbe headless — expose the LanProbe UI over HTTP(S) for remote access"

[lib]
name = "lanprobe_server"
path = "src/lib.rs"

[[bin]]
name = "lanprobe-server"
path = "src/main.rs"

[dependencies]
lanprobe-core = { path = "../lanprobe-core" }

serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }

# ⚠️ Plus aucune pile HTTP serveur ici. La sonde n'écoute sur aucun port :
# axum, hyper, tower, rustls/rcgen (certificat auto-signé), rust-embed
# (interface embarquée) et cookie (session) sont partis avec le serveur web,
# dont le rôle appartient maintenant au hub. `reqwest` reste : la sonde est
# cliente du hub, elle ne l'attend pas.
rand = { workspace = true }
getrandom = "0.2"
base64 = "0.22"
# AEAD pour le chiffrement au repos des secrets applicatifs (app_config.json).
ring = "0.17"

# CLI args + logging
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

dirs-next = { workspace = true }
reqwest = { workspace = true }

# Metadata pour `cargo deb` — génère le .deb headless avec systemd unit,
# postinst (setcap + adduser + systemctl enable) et prerm (stop service).
[package.metadata.deb]
name = "lanprobe-server"
maintainer = "LanProbe <noreply@lanprobe.io>"
copyright = "2026, LanProbe"
extended-description = """
LanProbe headless — expose the LanProbe network-management UI over HTTPS
so any browser on the LAN can drive the network tools of this host.
Ideal for a Raspberry Pi or a Debian server sitting on a VLAN to audit.
"""
depends = "$auto, adduser, libcap2-bin"
section = "net"
priority = "optional"
assets = [
    ["target/release/lanprobe-server", "usr/bin/", "755"],
    ["packaging/systemd/lanprobe-server.service", "lib/systemd/system/", "644"],
    ["../../src-tauri/resources/linux/speedtest", "usr/lib/lanprobe/speedtest", "755"],
]
maintainer-scripts = "packaging/debian"
