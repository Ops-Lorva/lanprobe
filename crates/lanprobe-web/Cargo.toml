[package]
name = "lanprobe-web"
# Version propre au hub : il se release independamment de l'app desktop, et
# `/api/status` l'annonce a l'interface. Heriter du workspace affichait
# « Hub 0.0.0 » a l'utilisateur.
version = "1.0.0"
edition.workspace = true
license.workspace = true
description = "LanProbe Web — hub auto-hébergé : comptes, sites, enrôlement et supervision des sondes"

[lib]
name = "lanprobe_web"
path = "src/lib.rs"

[[bin]]
name = "lanprobe-web"
path = "src/main.rs"

[dependencies]
# Interface web embarquée dans le binaire — pas de volume de statiques
# dont la version pourrait diverger de celle du hub.
rust-embed = { version = "8", features = ["interpolate-folder-path"] }
mime_guess = "2"

lanprobe-core = { path = "../lanprobe-core" }

serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
reqwest = { workspace = true }

axum = { version = "0.8", features = ["macros", "multipart"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
cookie = { version = "0.18", features = ["percent-encode"] }

# `bundled` : SQLite est compilé avec le binaire. Le conteneur n'a alors
# aucune libsqlite3 système à fournir, et la version ne dépend pas de l'image
# de base — un hub qui plante parce que Debian a reculé d'une mineure serait
# indéfendable pour un produit qu'on demande à l'utilisateur d'auto-héberger.
rusqlite = { version = "0.37", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }

# Empreinte du certificat auto-signé d'Influx : reqwest n'expose pas le
# certificat de son pair, on refait le handshake nous-mêmes pour le capturer.
rustls = { version = "0.23", features = ["ring"] }
tokio-rustls = "0.26"
rustls-platform-verifier = "0.6"
# Le hub sert en HTTPS : sans TLS le cookie de session `Secure` ne serait
# jamais renvoyé par le navigateur.
rcgen = "0.13"
rustls-pemfile = "2"
axum-server = { version = "0.7", features = ["tls-rustls"] }
ring = "0.17"
base64 = "0.22"
getrandom = "0.2"

# Archive de sauvegarde. ZIP et non tar.zst : l'utilisateur doit pouvoir
# l'ouvrir avec l'explorateur de son système sans rien installer, ce qui
# exclut zstd sous Windows et macOS. `deflate` seul — les autres méthodes de
# compression du format ne sont pas lues par tous les outils intégrés.
zip = { version = "4", default-features = false, features = ["deflate"] }

clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }

[dev-dependencies]
http-body-util = "0.1"
