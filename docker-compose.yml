# Hub LanProbe auto-hébergé — un seul conteneur (hub + InfluxDB embarqué).
# Nous n'hébergeons rien : ce fichier est fait pour tourner chez vous, sans
# rien d'autre à installer. `docker compose up -d` suffit.
#
# Après le premier démarrage, récupérez le jeton de configuration initial :
#   docker compose logs lanprobe-web | grep -i "jeton de configuration"
# (ou en anglais : "setup token")

services:
  lanprobe-web:
    build: .
    # Construisez votre propre image locale avec `build: .` (ci-dessus) tant
    # qu'aucune image publiée n'existe. Une fois publiée sur un registre,
    # remplacez par une version épinglée — jamais `:latest` :
    #   image: ghcr.io/benjamin-chianese/lanprobe-web:1.2.0
    container_name: lanprobe-web
    restart: unless-stopped

    # Aucune variable d'environnement n'est requise : `docker compose up`
    # marche tel quel. Tout se règle ensuite dans l'interface (organisation,
    # bucket, rétention, cadence des sauvegardes...) — voir le README.

    ports:
      # Interface web du hub — HTTPS auto-signé par défaut (voir le README,
      # section "Sécurité"). C'est ici que vous créez le compte admin, que
      # vous enrôlez vos sondes, et c'est par ici qu'elles envoient leurs
      # mesures : une seule porte, une seule authentification.
      - "8080:8080"
      # InfluxDB. **Optionnel, et fermé par défaut** : les sondes n'en ont
      # pas besoin, elles passent par le hub qui relaie. Ne l'ouvrez que pour
      # brancher un Grafana sur les séries, avec un jeton de lecture émis
      # depuis l'interface. Sans reverse proxy TLS de confiance devant, ne
      # l'exposez pas au-delà de votre réseau local.
      # - "8086:8086"

    volumes:
      # Comptes, jetons, base SQLite, certificat TLS du hub, `secret.key`.
      # Petit, change peu.
      - lanprobe_data:/data/lanprobe
      # Séries temporelles InfluxDB. Peut grossir de plusieurs Go avec le
      # temps.
      - influxdb_data:/data/influxdb
      # Archives de sauvegarde. Le hub en produit une par jour, tout seul, et
      # ne garde que les 7 dernières (les deux réglages sont dans
      # l'interface). Une archive porte la base, les mesures et les secrets.
      #
      # ⚠️ Un volume Docker nommé vit sur la même machine que le reste : il ne
      # protège de rien s'il faut la remplacer. Remplacez cette ligne par un
      # chemin de votre choix — idéalement sur un autre disque, ou un montage
      # réseau — pour que les archives survivent à la machine :
      #   - /mnt/nas/lanprobe-backups:/backup
      #
      # ⚠️ Ces archives contiennent `secret.key`, qui déchiffre les
      # identifiants SMTP et les URL de webhook du hub. Traitez le dossier
      # comme un secret.
      - lanprobe_backups:/backup

    # Le HEALTHCHECK est défini dans l'image (il interroge réellement
    # /api/status, pas seulement l'existence du processus).

volumes:
  lanprobe_data:
  influxdb_data:
  lanprobe_backups:
